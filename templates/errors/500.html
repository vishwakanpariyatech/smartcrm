{% extends 'base.html' %}

{% block title %}500 Server Error - SmartCRM{% endblock %}

{% block content %}
<div class="min-vh-50 d-flex align-items-center justify-content-center text-center py-5">
    <div style="max-width: 500px;">
        <div class="avatar-circle mx-auto mb-3 bg-danger bg-opacity-10 text-danger" style="width: 72px; height: 72px; font-size: 2rem;">
            <i class="bi bi-exclamation-octagon-fill"></i>
        </div>
        <h1 class="fw-bold text-dark mb-2">500 - Internal Server Error</h1>
        <p class="text-muted mb-4">
            An unexpected error occurred while processing your request. The issue has been recorded in the server diagnostic logs.
        </p>
        <a href="{% url 'dashboard:index' %}" class="btn btn-primary px-4">
            <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
