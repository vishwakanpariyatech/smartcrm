{% extends 'base.html' %}

{% block title %}404 Page Not Found - SmartCRM{% endblock %}

{% block content %}
<div class="min-vh-50 d-flex align-items-center justify-content-center text-center py-5">
    <div style="max-width: 500px;">
        <div class="avatar-circle mx-auto mb-3 bg-warning bg-opacity-10 text-warning" style="width: 72px; height: 72px; font-size: 2rem;">
            <i class="bi bi-question-circle-fill"></i>
        </div>
        <h1 class="fw-bold text-dark mb-2">404 - Page Not Found</h1>
        <p class="text-muted mb-4">
            The page, customer, or record you are looking for may have been moved, deleted, or does not exist.
        </p>
        <a href="{% url 'dashboard:index' %}" class="btn btn-primary px-4">
            <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
