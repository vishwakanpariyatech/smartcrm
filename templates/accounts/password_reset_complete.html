{% extends 'base.html' %}

{% block title %}Password Reset Complete - SmartCRM{% endblock %}

{% block auth_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light py-5 px-3">
    <div class="card border-0 shadow-lg text-center" style="max-width: 440px; width: 100%; border-radius: 1rem;">
        <div class="card-body p-4 p-md-5">
            <div class="avatar-circle mx-auto mb-3 bg-success bg-opacity-10 text-success" style="width: 56px; height: 56px; font-size: 1.6rem;">
                <i class="bi bi-shield-check"></i>
            </div>
            <h4 class="fw-bold text-dark">Password Updated!</h4>
            <p class="text-muted small mb-4">
                Your password has been set successfully. You can now sign in with your new credentials.
            </p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 py-2 fw-semibold">
                Sign In Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
