{% extends 'base.html' %}

{% block title %}Reset Password - SmartCRM{% endblock %}

{% block auth_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center py-5 px-3" style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);">
    <div class="card border-0 shadow-lg" style="max-width: 460px; width: 100%; border-radius: 1.25rem;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div style="width: 52px; height: 52px; background: rgba(245, 158, 11, 0.12); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.6rem; color: #f59e0b;" class="mb-3">
                    <i class="bi bi-key-fill"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Forgot Password?</h3>
                <p class="text-muted small">Enter your verified email address and we will dispatch password reset instructions to your inbox.</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label fw-semibold small text-secondary">Registered Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control" placeholder="name@company.com" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm" style="height: 46px; border-radius: 0.5rem;">
                    Send Reset Instructions
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center">
                <a href="{% url 'accounts:login' %}" class="small text-decoration-none text-secondary fw-semibold">
                    <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
