<!-- Global Delete Confirmation Modal -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 0.75rem;">
            <div class="modal-header border-0 pb-0">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center px-4 pt-0 pb-4">
                <div class="avatar-circle mx-auto mb-3 bg-danger bg-opacity-10 text-danger" style="width: 56px; height: 56px; font-size: 1.5rem;">
                    <i class="bi bi-trash3-fill"></i>
                </div>
                <h5 class="modal-title fw-bold text-dark mb-2" id="deleteConfirmModalLabel">Confirm Deletion</h5>
                <p class="text-muted small mb-4">
                    Are you sure you want to permanently delete <strong id="deleteItemName" class="text-dark">this record</strong>? This action cannot be undone.
                </p>
                <form id="deleteConfirmForm" method="POST" action="">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
